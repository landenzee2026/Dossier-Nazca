<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Dossier Nazca: detectivespel platentektoniek Zuid-Amerika voor vwo 6 (De Geo H1 §1.2).">
<title>Dossier Nazca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: één scherm als crisiskamer. Links het bewijsstuk (kaart of doorsnede), rechts het dossier met vragen. Bovenin missiebalk met klok en score. */
:root{
  --ink:#0c1822;        /* ondergrond: diep oceaanblauw */
  --panel:#122330;      /* panelen */
  --panel2:#18303f;     /* verhoogde vlakken */
  --line:#284457;       /* lijnen, rasters */
  --fg:#e3eaee;         /* tekst */
  --muted:#93aab6;      /* secundaire tekst */
  --amber:#f3a83b;      /* accent: seismisch alarm */
  --magma:#ec5b34;      /* vulkanen, fouten, deadline */
  --slab:#55c1c9;       /* data: aardbevingen */
  --ok:#86cf8a;         /* goed */
  --land:#2a3d33;       /* land op kaart */
  --land2:#36503f;
  --sea:#0f2231;
  --font-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;
  background-image:linear-gradient(rgba(85,193,201,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(85,193,201,.035) 1px,transparent 1px);
  background-size:28px 28px;}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;gap:10px;max-width:1500px;margin:0 auto}

/* Missiebalk */
.bar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.brand{font-family:var(--font-display);font-weight:800;font-size:26px;letter-spacing:.06em;line-height:1;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--magma);box-shadow:0 0 0 0 rgba(236,91,52,.7);animation:ping 1.6s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(236,91,52,.7)}70%{box-shadow:0 0 0 10px rgba(236,91,52,0)}100%{box-shadow:0 0 0 0 rgba(236,91,52,0)}}
.pips{display:flex;gap:6px;flex:1;min-width:0;justify-content:center;flex-wrap:wrap}
.pip{font-family:var(--font-mono);font-size:12px;padding:4px 9px;border:1px solid var(--line);border-radius:3px;color:var(--muted);white-space:nowrap}
.pip.on{border-color:var(--amber);color:var(--amber)}
.pip.done{background:rgba(134,207,138,.12);border-color:rgba(134,207,138,.5);color:var(--ok)}
.meters{display:flex;gap:16px;align-items:center}
.meter{display:flex;flex-direction:column;align-items:flex-end;line-height:1.05}
.meter small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.meter b{font-family:var(--font-mono);font-weight:600;font-size:24px;font-variant-numeric:tabular-nums}
.meter.clock b{color:var(--amber)}
.meter.clock.low b{color:var(--magma);animation:blink 1s steps(2) infinite}
.meter.clock.over b{color:var(--magma)}
@keyframes blink{50%{opacity:.45}}
.penalty{position:fixed;z-index:30;font-family:var(--font-mono);color:var(--magma);font-weight:600;pointer-events:none;animation:floatup 1.2s ease-out forwards}
@keyframes floatup{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-30px)}}

/* Hoofdgrid */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.22fr) minmax(0,1fr);gap:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.phead{display:flex;align-items:baseline;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tag{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);background:var(--amber);padding:2px 7px;border-radius:2px;font-weight:600}
.tag.teal{background:var(--slab)}
.phead h2{margin:0;font-family:var(--font-display);font-weight:600;font-size:21px;letter-spacing:.03em;text-transform:uppercase;text-wrap:balance}
.phead .src{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.figwrap{flex:1;min-height:0;position:relative;padding:8px;display:flex;align-items:center;justify-content:center}
.figwrap svg{width:100%;height:100%;display:block}
.figfoot{padding:6px 14px 9px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg i{display:inline-block;width:14px;height:3px;border-radius:2px}
.case{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px}
.lead{margin:0;color:var(--fg);max-width:65ch}
.lead em{color:var(--amber);font-style:normal}
.qbox{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.qnum{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.qtext{margin:0;font-weight:600;font-size:15.5px;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{text-align:left;background:var(--ink);border:1px solid var(--line);border-radius:5px;padding:8px 11px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--muted)}
.opt .k{font-family:var(--font-mono);font-size:12px;color:var(--muted);min-width:18px;padding-top:1px}
.opt.sel{border-color:var(--amber);background:rgba(243,168,59,.08)}
.opt.sel .k{color:var(--amber)}
.opt.bad{border-color:var(--magma);opacity:.55}
.opt.good{border-color:var(--ok);background:rgba(134,207,138,.1)}
.opt[disabled]{cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--amber);color:#1b1206;border:0;border-radius:4px;padding:8px 16px;font-weight:600;cursor:pointer;letter-spacing:.02em}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.4;cursor:default;filter:none}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.ghost:hover{color:var(--fg);border-color:var(--muted)}
.btn.big{font-size:17px;padding:11px 24px}
.fb{border-left:3px solid var(--magma);padding:6px 10px;background:rgba(236,91,52,.08);font-size:14px;border-radius:0 4px 4px 0}
.fb.ok{border-color:var(--ok);background:rgba(134,207,138,.08)}
.fb.hint{border-color:var(--slab);background:rgba(85,193,201,.08)}
.fb b{font-weight:600}
.assign{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 10px;align-items:center}
.assign label{font-size:14px}
.assign label b{font-family:var(--font-mono);color:var(--amber);margin-right:4px}
select,input[type=number],input[type=text]{background:var(--ink);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:6px 8px;font:inherit;font-size:14px;width:100%;min-width:0}
select.bad{border-color:var(--magma)} select.good{border-color:var(--ok)}
.numrow{display:flex;gap:8px;align-items:center}
.numrow input{width:120px}
.seq{display:flex;flex-direction:column;gap:6px}
.card{background:var(--ink);border:1px dashed var(--line);border-radius:5px;padding:7px 10px;cursor:pointer;font-size:14px;text-align:left;display:flex;gap:10px}
.card:hover{border-color:var(--muted)}
.card.used{opacity:.35;cursor:default}
.card .n{font-family:var(--font-mono);color:var(--amber);min-width:16px}
.slotlist{display:flex;flex-direction:column;gap:5px;counter-reset:s}
.slot{border:1px solid var(--line);border-radius:5px;padding:7px 10px;font-size:14px;min-height:36px;background:rgba(243,168,59,.05);display:flex;gap:10px}
.slot .n{font-family:var(--font-mono);color:var(--amber)}
.slot.empty{color:var(--muted);font-style:italic;background:transparent}
input[type=range]{width:100%;accent-color:var(--amber)}
.anglev{font-family:var(--font-mono);font-size:22px;color:var(--amber);min-width:70px;text-align:right}
.concl{border:1px solid rgba(134,207,138,.45);background:rgba(134,207,138,.06);border-radius:6px;padding:12px 14px;position:relative;overflow:hidden}
.concl h3{margin:0 0 4px;font-family:var(--font-display);font-size:19px;letter-spacing:.04em;text-transform:uppercase;color:var(--ok)}
.concl p{margin:0;max-width:62ch}
.stamp{position:absolute;right:12px;top:8px;font-family:var(--font-display);font-weight:800;font-size:26px;letter-spacing:.08em;color:var(--ok);border:3px solid var(--ok);padding:0 10px;transform:rotate(-8deg);opacity:.85;animation:stamp .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{transform:rotate(-8deg) scale(2.2);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:.85}}
.pts{font-family:var(--font-mono);color:var(--amber)}

/* Intro en rapport */
.full{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:10px}
.hero{padding:20px 24px;display:flex;flex-direction:column;gap:14px}
.alert{display:flex;gap:10px;align-items:center;font-family:var(--font-mono);font-size:12.5px;color:var(--magma);letter-spacing:.08em;text-transform:uppercase}
.hero h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(40px,5.4vw,72px);line-height:.92;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.hero h1 span{color:var(--amber)}
.readout{font-family:var(--font-mono);font-size:13px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.readout div{background:var(--ink);padding:7px 10px;min-width:0}
.readout small{display:block;font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.readout b{font-weight:600;font-size:15px;color:var(--fg)}
canvas.seis{width:100%;height:120px;display:block;background:var(--ink);border:1px solid var(--line);border-radius:4px}
.brief{margin:0;max-width:62ch}
.brief strong{color:var(--amber);font-weight:600}
.qlist{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.qlist li{display:flex;gap:10px;align-items:baseline}
.qlist li span{font-family:var(--font-mono);color:var(--amber);font-size:12px}
.whk{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 12px;font-size:14px;margin:0}
.whk dt{font-family:var(--font-display);font-weight:800;font-size:17px;letter-spacing:.06em;color:var(--slab)}
.whk dd{margin:0}
.side{padding:18px 20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.side h3{margin:0;font-family:var(--font-display);font-size:20px;letter-spacing:.05em;text-transform:uppercase}
.note{font-size:12.5px;color:var(--muted)}
.report{padding:20px 24px;display:flex;flex-direction:column;gap:14px;position:relative}
.rank{font-family:var(--font-display);font-weight:800;font-size:40px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);border:4px solid var(--amber);padding:2px 16px;transform:rotate(-4deg);align-self:flex-start;animation:stamp .5s cubic-bezier(.2,1.6,.4,1)}
.rtab{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.rtab td,.rtab th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.rtab th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.rtab td.r,.rtab th.r{text-align:right;font-family:var(--font-mono)}
.rtab tr.tot td{font-weight:600;color:var(--amber);border-bottom:0}
.memo{display:flex;flex-direction:column;gap:9px}
.memo div{border-left:3px solid var(--slab);padding:4px 10px}
.memo b{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--slab);font-weight:600}
.task{border:1px dashed var(--amber);border-radius:6px;padding:12px 14px;background:rgba(243,168,59,.05)}
.task h3{color:var(--amber)}
.fadein{animation:fi .4s ease-out}
@keyframes fi{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
svg text{font-family:var(--font-mono)}
.pulse{animation:pr 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pr{0%{transform:scale(.4);opacity:.9}100%{transform:scale(3.2);opacity:0}}
.dropin{animation:dropin .5s ease-out both}
@keyframes dropin{from{opacity:0}to{opacity:1}}
.draw{stroke-dasharray:2000;stroke-dashoffset:2000;animation:draw 1.6s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pick{cursor:crosshair}
.rocks{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;height:100%;padding:6px}
.rock{display:flex;flex-direction:column;gap:8px;min-width:0}
.rock canvas{width:100%;aspect-ratio:4/3;border-radius:50% 46% 48% 44%/44% 50% 46% 52%;display:block;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.rock h4{margin:0;font-family:var(--font-display);font-size:20px;letter-spacing:.05em;text-transform:uppercase}
.rock dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;font-size:13px}
.rock dt{color:var(--muted)} .rock dd{margin:0}
.rock .find{font-family:var(--font-mono);font-size:11.5px;color:var(--amber)}
@media (max-width:900px){
  html,body{height:auto}
  .app{height:auto}
  .main,.full{grid-template-columns:1fr}
  .figwrap{height:62vw;min-height:300px}
  .case{overflow:visible}
  .meters{margin-left:auto}
  .readout{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rocks{grid-template-columns:1fr}
}
@media (max-height:760px) and (min-width:901px){
  body{font-size:14px}
  .qtext{font-size:14.5px}
  .opt{padding:6px 10px}
  .hero{padding:14px 20px;gap:10px}
  canvas.seis{height:90px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}}

body{margin:0}
</style>
</head>

function viewBoxFor(lonMin,lonMax,latMax,latMin){ const [x0,y0]=P(lonMin,latMax), [x1,y1]=P(lonMax,latMin); return [x0,y0,x1-x0,y1-y0]; }
function tri(x,y,s,cls,fill){ return `<path class="${cls||''}" d="M${r1(x)},${r1(y-s)}L${r1(x+s*.9)},${r1(y+s*.6)}L${r1(x-s*.9)},${r1(y+s*.6)}Z" fill="${fill||'var(--magma)'}" stroke="var(--ink)" stroke-width="${s*.15}"/>`; }
const BCOL = {sub:'var(--magma)',tr:'#c9a3ff',cv:'var(--amber)',div:'var(--slab)'};
function mapSVG(o){
  const vb=o.vb, k=Math.max(vb[2],vb[3]*1.1)/600; // schaalfactor voor lijndiktes
  let s=`<svg viewBox="${vb.map(r1).join(' ')}" role="img" aria-label="${o.aria||'Kaart'}" preserveAspectRatio="xMidYMid meet">`;
  s+=`<rect x="${vb[0]}" y="${vb[1]}" width="${vb[2]}" height="${vb[3]}" fill="var(--sea)"/>`;
  // graticule
  for(const [lat,y] of Object.entries(DATA.grat.lat)) s+=`<line x1="${vb[0]}" x2="${vb[0]+vb[2]}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="${.8*k}"/><text x="${vb[0]+4*k}" y="${y-3*k}" font-size="${11*k}" fill="var(--muted)">${lat==0?'0°':Math.abs(lat)+'°'+(lat<0?' ZB':' NB')}</text>`;
  for(const [lon,x] of Object.entries(DATA.grat.lon)) if(x>vb[0]+45*k && x<vb[0]+vb[2]-20*k) s+=`<line y1="${vb[1]}" y2="${vb[1]+vb[3]}" x1="${x}" x2="${x}" stroke="var(--line)" stroke-width="${.8*k}"/><text x="${x+3*k}" y="${vb[1]+vb[3]-5*k}" font-size="${11*k}" fill="var(--muted)">${Math.abs(lon)}° WL</text>`;
  s+=`<path d="${DATA.land}" fill="var(--land)" stroke="var(--land2)" stroke-width="${1*k}"/>`;
  if(o.extraBelow) s+=o.extraBelow(k);
  if(o.bnd){ for(const [name,[type,d]] of Object.entries(DATA.bnd)){ const col=o.bnd==='typed'?BCOL[type]:'#d7e1e6'; s+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="${(o.bnd==='typed'?2.6:1.8)*k}" stroke-linejoin="round" ${o.bnd==='typed'&&type==='sub'?`stroke-dasharray="${7*k} ${3*k}"`:''}/>`; } }
  if(o.volc) for(const v of DATA.volc) s+=tri(v[0],v[1],o.volcSize||4.2*k,'','var(--magma)');
  if(o.extra) s+=o.extra(k);
  return s+'</svg>';
}
function quakeDot(x,y,k,label,big){ return `<circle cx="${x}" cy="${y}" r="${(big?7:5)*k}" fill="var(--amber)" class="pulse"/><circle cx="${x}" cy="${y}" r="${(big?6:4.5)*k}" fill="var(--amber)" stroke="var(--ink)" stroke-width="${1.2*k}"/>${label?`<text x="${x+9*k}" y="${y+4*k}" font-size="${13*k}" fill="var(--amber)" font-weight="600">${label}</text>`:''}`; }
function label(x,y,t,k,col,size,anchor){ return `<text x="${x}" y="${y}" font-size="${(size||13)*k}" fill="${col||'var(--fg)'}" text-anchor="${anchor||'start'}" font-weight="600" paint-order="stroke" stroke="var(--ink)" stroke-width="${3*k}">${t}</text>`; }

    for(const [L,[lon,lat]] of Object.entries(D1POS)){ const [x,y]=P(lon,lat); s+=`<circle cx="${x}" cy="${y}" r="${12*k}" fill="var(--ink)" stroke="var(--amber)" stroke-width="${2*k}"/><text x="${x}" y="${y+5*k}" text-anchor="middle" font-size="${15*k}" fill="var(--amber)" font-weight="600">${L}</text>`; }

      const [ax,ay]=P(-80,-28.5); s+=`<path d="M${ax},${ay} l${30*k},0" stroke="var(--fg)" stroke-width="${2*k}" marker-end="url(#ar)"/>`; s+=label(ax,ay-6*k,'6–8 cm/jaar',k,'var(--fg)',11);
      const [bx,by]=P(-50,-30); s+=`<path d="M${bx},${by} l${-30*k},0" stroke="var(--fg)" stroke-width="${2*k}" marker-end="url(#ar)"/>`; s+=label(bx-30*k,by-6*k,'± 3 cm/jaar',k,'var(--fg)',11);

function legendD1(st){ return st.typed ? `<span class="lg"><i style="background:var(--magma)"></i>subductie</span><span class="lg"><i style="background:var(--amber)"></i>convergent (compressie)</span><span class="lg"><i style="background:#c9a3ff"></i>transform</span><span class="lg"><i style="background:var(--slab)"></i>divergent (rug)</span><span class="lg"><i style="background:var(--ok)"></i>passieve rand</span>` : `<span>Wit = plaatgrens of continentrand, nog niet getypeerd. De gele punt is het epicentrum van vanavond.</span>`; }

// Doorsnede
const PX = km => 60 + (km+100)*0.72, PY = d => 70 + d*0.72;
const VOLC_A = [[285,'Irruputuncu'],[299,'Olca'],[355,'Putana'],[353,'Sairecabur'],[354,'Licancabur'],[370,'Láscar'],[367,'Purico'],[384,'Guayaques']];
function profileSVG(st,key){
  const data=DATA.prof[key];
  let s=`<svg viewBox="0 0 800 520" role="img" aria-label="Doorsnede: diepte van aardbevingen tegen afstand tot de trog">`;
  s+=`<defs><linearGradient id="mant" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2d3b"/><stop offset="1" stop-color="#2b2219"/></linearGradient><clipPath id="cp"><rect x="60" y="70" width="720" height="432"/></clipPath></defs>`;
  s+=`<rect x="60" y="70" width="720" height="432" fill="url(#mant)"/>`;
  for(let d=0;d<=600;d+=100){ s+=`<line x1="60" x2="780" y1="${PY(d)}" y2="${PY(d)}" stroke="var(--line)" stroke-width=".7"/><text x="52" y="${PY(d)+4}" font-size="11" fill="var(--muted)" text-anchor="end">${d}</text>`; }
  for(let x=-100;x<=900;x+=100){ s+=`<line y1="70" y2="502" x1="${PX(x)}" x2="${PX(x)}" stroke="var(--line)" stroke-width=".7"/><text x="${PX(x)}" y="516" font-size="11" fill="var(--muted)" text-anchor="middle">${x}</text>`; }
  s+=`<text x="16" y="290" font-size="11" fill="var(--muted)" transform="rotate(-90 16 290)" text-anchor="middle">diepte (km)</text>`;
  // oppervlak (schematisch)
  const coast = key==='A'?115:97;
  s+=`<path d="M60,70 L${PX(-5)},70 L${PX(0)},74 L${PX(coast)},70 Z" fill="#163a52" opacity=".9"/>`;
  const topo = key==='A'
    ? `M${PX(coast)},70 L${PX(coast+20)},60 L${PX(200)},52 L${PX(260)},40 L${PX(320)},32 L${PX(380)},30 L${PX(470)},33 L${PX(530)},34 L${PX(570)},48 L${PX(620)},62 L${PX(700)},66 L780,66 L780,70 Z`
    : `M${PX(coast)},70 L${PX(coast+30)},58 L${PX(200)},50 L${PX(260)},36 L${PX(300)},34 L${PX(360)},46 L${PX(430)},56 L${PX(470)},50 L${PX(520)},58 L${PX(600)},64 L780,66 L780,70 Z`;
  s+=`<path d="${topo}" fill="var(--land2)"/>`;
  s+=`<line x1="${PX(0)}" x2="${PX(0)}" y1="62" y2="80" stroke="var(--fg)" stroke-width="1.5"/><text x="${PX(0)}" y="56" font-size="11" fill="var(--fg)" text-anchor="middle">trog</text>`;
  s+=`<text x="${PX(-55)}" y="64" font-size="10.5" fill="var(--muted)" text-anchor="middle">oceaan</text>`;
  s+=`<text x="${PX(key==='A'?340:280)}" y="${key==='A'?24:28}" font-size="11" fill="var(--fg)" text-anchor="middle">${key==='A'?'Andes · Altiplano':'Andes'}</text>`;
  s+=`<text x="776" y="60" font-size="9.5" fill="var(--muted)" text-anchor="end">hoogte overdreven, niet op schaal</text>`;
  // spookdata
  if(st.ghost){ for(const [x,d,m] of DATA.prof[st.ghost]) s+=`<circle cx="${r1(PX(x))}" cy="${r1(PY(d))}" r="2.2" fill="#8a9aa3" opacity=".22" clip-path="url(#cp)"/>`; }
  // zone 100-150
  if(st.zone) s+=`<rect x="60" y="${PY(100)}" width="720" height="${PY(150)-PY(100)}" fill="var(--amber)" opacity=".09"/><text x="776" y="${PY(125)+4}" font-size="11" fill="var(--amber)" text-anchor="end">100–150 km: water komt vrij</text>`;
  // punten
  const sorted=data.slice().sort((a,b)=>a[0]-b[0]);
  sorted.forEach(([x,d,m],i)=>{ const r=Math.max(1.6,(m/10-4.6)*2.6); s+=`<circle class="${st.anim?'dropin':''}" style="${st.anim?`animation-delay:${(i/sorted.length*1.4).toFixed(2)}s`:''}" cx="${r1(PX(x))}" cy="${r1(PY(d))}" r="${r1(r)}" fill="var(--slab)" fill-opacity=".55" stroke="var(--slab)" stroke-width=".6" clip-path="url(#cp)"/>`; });
  // hoek
  if(st.angle!=null){ const a=st.angle*Math.PI/180; const L=1200; const x2=PX(0)+Math.cos(a)*L*0.72, y2=PY(0)+Math.sin(a)*L*0.72;
    s+=`<line x1="${PX(0)}" y1="${PY(0)}" x2="${r1(x2)}" y2="${r1(y2)}" stroke="var(--amber)" stroke-width="2.5" stroke-dasharray="8 5" clip-path="url(#cp)"/>`;
    s+=`<path d="M${PX(0)+70},${PY(0)} A70,70 0 0 1 ${r1(PX(0)+70*Math.cos(a))},${r1(PY(0)+70*Math.sin(a))}" fill="none" stroke="var(--amber)" stroke-width="1.5"/><text x="${PX(0)+78}" y="${PY(0)+18}" font-size="12" fill="var(--amber)">${st.angle}°</text>`; }
  // vlakke plaat schets
  if(st.slab==='A') s+=`<path class="draw" d="M${PX(0)},${PY(0)} C${PX(150)},${PY(40)} ${PX(250)},${PY(95)} ${PX(330)},${PY(140)} S${PX(520)},${PY(250)} ${PX(800)},${PY(530)}" fill="none" stroke="var(--magma)" stroke-width="3" opacity=".85" clip-path="url(#cp)"/>`;
  if(st.slab==='B') s+=`<path class="draw" d="M${PX(0)},${PY(0)} C${PX(120)},${PY(45)} ${PX(200)},${PY(95)} ${PX(280)},${PY(105)} L${PX(560)},${PY(118)} C${PX(620)},${PY(122)} ${PX(660)},${PY(150)} ${PX(720)},${PY(190)}" fill="none" stroke="var(--magma)" stroke-width="3" opacity=".85" clip-path="url(#cp)"/>`;
  // voorspelling
  if(st.pick!=null){ s+=`<line x1="${PX(st.pick)}" x2="${PX(st.pick)}" y1="40" y2="502" stroke="var(--amber)" stroke-width="1.5" stroke-dasharray="4 4"/>`+tri(PX(st.pick),40,9,'','var(--amber)')+`<text x="${PX(st.pick)+12}" y="44" font-size="11" fill="var(--amber)">jouw voorspelling</text>`; }
  if(st.volc && key==='A'){ VOLC_A.forEach(([x,n],i)=>{ s+=`<g class="dropin" style="animation-delay:${(i*.08).toFixed(2)}s">${tri(PX(x),30-(i%2)*2,7,'','var(--magma)')}</g>`; }); s+=`<text x="${PX(335)}" y="12" font-size="11" fill="var(--magma)" text-anchor="middle">echte vulkanen (Smithsonian GVP)</text>`; }
  if(key==='B'){ s+=quakeDot(PX(91),PY(22),1,'Illapel 2015, M8,3',true);
    if(st.caucete) s+=`<ellipse cx="${PX(475)}" cy="${PY(28)}" rx="34" ry="24" fill="none" stroke="var(--amber)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${PX(475)}" y="${PY(28)+40}" font-size="11" fill="var(--amber)" text-anchor="middle">ondiepe bevingen in de korst</text>`;
    s+=`<text x="${PX(340)}" y="16" font-size="11" fill="var(--muted)" text-anchor="middle">27°–33° ZB: 0 actieve vulkanen</text>`; }
  if(st.pickable) s+=`<rect id="pickzone" class="pick" x="60" y="0" width="720" height="502" fill="transparent"/>`;
  return s+'</svg>';
}

// Dossier 5 gesteenten
function drawRock(cv,kind){
  const ctx=cv.getContext('2d'); const W=cv.width=480,H=cv.height=360; let seed=kind==='A'?7:13; const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  ctx.fillStyle=kind==='A'?'#9a9d9b':'#2c2e30'; ctx.fillRect(0,0,W,H);
  for(let i=0;i<9000;i++){ const g=kind==='A'?120+rnd()*60:30+rnd()*40; ctx.fillStyle=`rgb(${g},${g+2},${g+1})`; ctx.fillRect(rnd()*W,rnd()*H,1.6,1.6); }
  if(kind==='A'){ for(let i=0;i<55;i++){ ctx.save(); ctx.translate(rnd()*W,rnd()*H); ctx.rotate(rnd()*Math.PI); const l=6+rnd()*16; ctx.fillStyle='rgba(240,238,228,.9)'; ctx.fillRect(-l/2,-2,l,4.5); ctx.restore(); }
    for(let i=0;i<70;i++){ ctx.fillStyle='rgba(25,25,28,.85)'; ctx.beginPath(); ctx.arc(rnd()*W,rnd()*H,1.5+rnd()*2.5,0,7); ctx.fill(); } }
  else { for(let i=0;i<60;i++){ const x=rnd()*W,y=rnd()*H,r=2+rnd()*4.5; ctx.fillStyle=`rgba(${110+rnd()*40},${150+rnd()*40},${50+rnd()*30},.95)`; ctx.beginPath(); ctx.ellipse(x,y,r,r*.8,rnd()*3,0,7); ctx.fill(); ctx.fillStyle='rgba(255,255,220,.35)'; ctx.fillRect(x-r*.3,y-r*.4,r*.4,r*.3); }
    for(let i=0;i<30;i++){ ctx.fillStyle='rgba(10,10,12,.9)'; ctx.beginPath(); ctx.arc(rnd()*W,rnd()*H,1+rnd()*3,0,7); ctx.fill(); } }
  const gr=ctx.createRadialGradient(W*.35,H*.3,20,W/2,H/2,W*.65); gr.addColorStop(0,'rgba(255,255,255,.12)'); gr.addColorStop(1,'rgba(0,0,0,.45)'); ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);
}

/* ---------- Toestand ---------- */
const TOTAL = 15*60;
let S = { screen:'intro', d:0, q:0, time:TOTAL, running:false, name:'', scores:DOSSIERS.map(d=>d.qs.map(()=>null)), tries:0, hintUsed:false, fig:{}, sel:null, solved:false, finishedAt:null };
let timerId=null;
function startTimer(){ if(timerId) return; timerId=setInterval(()=>{ if(!S.running) return; S.time--; renderBar(); },1000); }
function penalty(sec,el){ S.time-=sec; renderBar(); const b=(el||$('#clock'))?.getBoundingClientRect(); if(!b) return; const p=document.createElement('div'); p.className='penalty'; p.textContent='−'+sec+' s'; p.style.left=(b.left+b.width/2-20)+'px'; p.style.top=(b.bottom+4)+'px'; document.body.appendChild(p); setTimeout(()=>p.remove(),1300); }

/* ---------- Render ---------- */
function renderBar(){
  const clock=$('#clock'); if(!clock) return;
  clock.querySelector('b').textContent = fmt(S.time);
  clock.classList.toggle('low', S.time<=120 && S.time>0); clock.classList.toggle('over', S.time<=0);
  clock.querySelector('small').textContent = S.time<=0?'overtijd':'deadline minister';
  $('#score').textContent = scoreSum();
}
function scoreSum(){ return S.scores.flat().reduce((a,b)=>a+(b||0),0); }
function barHTML(){
  const pips = DOSSIERS.map((d,i)=>`<span class="pip ${i<S.d||S.screen==='report'?'done':i===S.d&&S.screen==='play'?'on':''}">${d.code} ${i<S.d||S.screen==='report'?'✓':''}</span>`).join('');
  return `<header class="bar"><div class="brand"><span class="dot" aria-hidden="true"></span>Dossier Nazca</div><nav class="pips" aria-label="Voortgang">${pips}</nav>
  <div class="meters"><div class="meter"><small>score</small><b id="score">${scoreSum()}</b></div><div class="meter clock" id="clock"><small>deadline minister</small><b>${fmt(S.time)}</b></div></div></header>`;
}

function render(){
  const app=$('#app');
  if(S.screen==='intro'){ app.innerHTML = barHTML()+introHTML(); setupIntro(); renderBar(); return; }
  if(S.screen==='report'){ app.innerHTML = barHTML()+reportHTML(); renderBar(); return; }
  const D=DOSSIERS[S.d];
  app.innerHTML = barHTML()+`<main class="main">
    <section class="panel" aria-label="Bewijsstuk"><div class="phead"><span class="tag teal">bewijsstuk ${D.code}</span><h2>${figTitle(D)}</h2><span class="src">bron: ${D.src}</span></div>
      <div class="figwrap" id="fig"></div><div class="figfoot" id="figfoot"></div></section>
    <section class="panel" aria-label="Dossier"><div class="phead"><span class="tag">dossier ${D.code}</span><h2>${D.title}</h2></div><div class="case" id="case"></div></section></main>`;
  renderFig(); renderCase(); renderBar();
}
function figTitle(D){ return {d1:'Plaatgrenzen rond Zuid-Amerika',pA:'Doorsnede 22° ZB · bevingen naar diepte',pB:'Doorsnede 31° ZB · bevingen naar diepte',d4:'Oceaanbodem voor de kust van Chili',d5:'Twee gesteentemonsters',d6:'Zware bevingen langs Chili sinds 1900'}[D.fig]; }
function renderFig(){
  const D=DOSSIERS[S.d], st=S.fig, el=$('#fig'), ft=$('#figfoot');
  if(D.fig==='d1'){ el.innerHTML=figD1(st); ft.innerHTML=legendD1(st); }
  if(D.fig==='pA'){ el.innerHTML=profileSVG(st,'A'); ft.innerHTML=`<span class="lg"><i style="background:var(--slab);height:8px;width:8px;border-radius:50%"></i>aardbeving (groter = zwaarder)</span><span>x: afstand tot de trog (km) · y: diepte (km) · ware schaal</span>`+(st.volc?`<span class="lg"><i style="background:var(--magma)"></i>actieve vulkaan</span>`:''); bindPick(); }
  if(D.fig==='pB'){ el.innerHTML=profileSVG(st,'B'); ft.innerHTML=`<span class="lg"><i style="background:var(--slab);height:8px;width:8px;border-radius:50%"></i>aardbeving 30–32° ZB</span><span class="lg"><i style="background:#8a9aa3;height:8px;width:8px;border-radius:50%"></i>ter vergelijking: 22° ZB</span><span>ware schaal</span>`; }
  if(D.fig==='d4'){ el.innerHTML=figD4(st); ft.innerHTML=`<span class="lg"><i style="background:var(--magma)"></i>actieve vulkaan (▲)</span><span class="lg"><i style="background:var(--slab)"></i>onderzeese rug</span><span class="lg"><i style="background:var(--amber)"></i>vulkaangat</span>`; }
  if(D.fig==='d5'){ el.innerHTML=figD5(); drawRock($('#rockA'),'A'); drawRock($('#rockB'),'B'); ft.innerHTML='<span>Illustraties van een vers breukvlak, ongeveer 3 × vergroot.</span>'; }
  if(D.fig==='d6'){ el.innerHTML=figD6(st); ft.innerHTML=`<span class="lg"><i style="background:var(--amber);height:10px;width:10px;border-radius:50%"></i>cirkel: grootte schaalt met de energie (×32 per magnitude-eenheid, hier afgezwakt)</span>`; }
}
function bindPick(){ const z=document.getElementById('pickzone'); if(!z) return; z.addEventListener('click',ev=>{ const svg=z.ownerSVGElement; const pt=svg.createSVGPoint(); pt.x=ev.clientX; pt.y=ev.clientY; const p=pt.matrixTransform(svg.getScreenCTM().inverse()); const km=Math.round((p.x-60)/0.72-100); S.fig.pick=km; S.sel=km; renderFig(); renderCase(); }); }

function qHTML(q,qi,D){
  const done=S.solved; let h=`<div class="qbox fadein"><div class="qnum"><span>vraag ${qi+1} van ${D.qs.length}</span><span>${done?'':`poging ${S.tries+1} · ${[100,60,30][Math.min(S.tries,2)]} punten`}</span></div><p class="qtext">${q.text}</p>`;
  if(q.type==='mc'||q.type==='multi'){ if(!q._o) q._o=shuffle(q.opts.map((o,i)=>i)); const sel=S.sel||[];
    h+=`<div class="opts" role="group">`+q._o.map((oi,n)=>{ const o=q.opts[oi]; let c=''; if(sel.includes(oi)) c='sel'; if(done&&o[1]) c='good'; if(q._bad&&q._bad.includes(oi)) c='bad';
      return `<button class="opt ${c}" data-opt="${oi}" ${done?'disabled':''}><span class="k">${'ABCDEF'[n]}</span><span>${o[0]}</span></button>`; }).join('')+`</div>`;
    if(q.type==='multi') h+=`<span class="note">Kies er precies ${q.need}.</span>`; }
  if(q.type==='assign'){ if(!q._sel) q._sel=q.rows.map(()=> ''); h+=`<div class="assign">`+q.rows.map((r,i)=>{ const ok=q._chk?q._chk[i]:null;
      return `<label for="as${i}"><b>${r[0]}</b>${r[1]}</label><select id="as${i}" data-as="${i}" class="${done||ok===true?'good':ok===false?'bad':''}" ${done?'disabled':''}><option value="">kies…</option>${q.choices.filter(c=>choiceFits(q,r,c)).map(c=>`<option value="${c[0]}" ${(done?r[2]:q._sel[i])===c[0]?'selected':''}>${c[1]}</option>`).join('')}</select>`; }).join('')+`</div>`; }
  if(q.type==='order'){ if(!q._o) q._o=shuffle(q.cards.map((c,i)=>i)); const seq=done?q.cards.map((c,i)=>i):(S.sel||[]);
    h+=`<div class="slotlist">`+q.cards.map((c,i)=> seq[i]!=null?`<div class="slot"><span class="n">${i+1}</span><span>${q.cards[seq[i]]}</span></div>`:`<div class="slot empty"><span class="n">${i+1}</span><span>klik hieronder een kaart</span></div>`).join('')+`</div>`;
    if(!done) h+=`<div class="seq">`+q._o.map(ci=>`<button class="card ${seq.includes(ci)?'used':''}" data-card="${ci}" ${seq.includes(ci)?'disabled':''}><span class="n">+</span><span>${q.cards[ci]}</span></button>`).join('')+`</div><div class="row"><button class="btn ghost" data-act="clear">Wis volgorde</button></div>`; }
  if(q.type==='num'){ h+=`<div class="numrow"><input type="number" id="numin" step="0.1" inputmode="decimal" ${done?'disabled':''} value="${S.sel??''}" aria-label="Antwoord"><span>${q.unit}</span></div>`; }
  if(q.type==='angle'){ const v=S.fig.angle??q.start; h+=`<div class="numrow"><input type="range" id="angin" min="5" max="75" value="${v}" ${done?'disabled':''} aria-label="Hellingshoek"><span class="anglev" id="angv">${v}°</span></div>`; }
  if(q.type==='pick'){ h+=`<div class="note">${S.fig.pick!=null?`Jouw voorspelling: <b class="pts">${S.fig.pick} km</b> van de trog.`:'Klik in de doorsnede links.'}</div>`; }
  if(q._fb) h+=`<div class="fb">${q._fb}</div>`;
  if(q._hint) h+=`<div class="fb hint"><b>Tip van je collega:</b> ${q.hint}</div>`;
  if(done){ const pts=S.scores[S.d][qi]; h+=`<div class="fb ok"><b>${pts>0?`Klopt. +${pts} punten.`:'Dit is het juiste antwoord.'}</b> ${q.why}</div>`;
    h+=`<div class="row"><button class="btn" data-act="next">${qi<D.qs.length-1?'Volgende vraag →':'Bewijs vastleggen →'}</button></div>`; }
  else h+=`<div class="row"><button class="btn" data-act="check" ${canCheck(q)?'':'disabled'}>Controleer</button>${q._hint?'':`<button class="btn ghost" data-act="hint">Tip (−30 s)</button>`}</div>`;
  return h+`</div>`;
}
function choiceFits(q,r,c){ // in het lab per rij alleen relevante opties tonen
  if(q.rows.length===6){ const kind=r[1].split(': ')[1]; const groups={gesteente:['and','bas','gra'],vulkaantype:['strato','schild'],ontstaan:['subductie','hotspot']}; return groups[kind].includes(c[0]); }
  return true; }
function canCheck(q){ if(q.type==='mc') return (S.sel||[]).length===1; if(q.type==='multi') return (S.sel||[]).length===q.need; if(q.type==='assign') return q._sel.every(v=>v); if(q.type==='order') return (S.sel||[]).length===q.cards.length; if(q.type==='num') return S.sel!==null&&S.sel!==''; if(q.type==='angle') return true; if(q.type==='pick') return S.fig.pick!=null; }

function renderCase(){
  const D=DOSSIERS[S.d], el=$('#case');
  if(S.q>=D.qs.length){ el.innerHTML=`<p class="lead">${D.lead}</p><div class="concl fadein"><span class="stamp">OPGELOST</span><h3>Bewijs vastgelegd</h3><p>${D.concl}</p></div><div class="row"><button class="btn big" data-act="nextd">${S.d<DOSSIERS.length-1?`Naar dossier ${DOSSIERS[S.d+1].code} →`:'Rapport aan de minister →'}</button></div>`; return; }
  const q=D.qs[S.q];
  el.innerHTML = `<p class="lead">${D.lead}</p>` + qHTML(q,S.q,D);
  const ang=$('#angin'); if(ang) ang.addEventListener('input',e=>{ S.fig.angle=+e.target.value; $('#angv').textContent=S.fig.angle+'°'; renderFig(); });
  if(q.type==='angle' && S.fig.angle==null){ S.fig.angle=q.start; renderFig(); }
  const num=$('#numin'); if(num) num.addEventListener('input',e=>{ S.sel=e.target.value; el.querySelector('[data-act=check]').disabled=!canCheck(q); });
  el.querySelectorAll('[data-as]').forEach(s=>s.addEventListener('change',e=>{ q._sel[+e.target.dataset.as]=e.target.value; if(q._chk) q._chk[+e.target.dataset.as]=null; e.target.className=''; el.querySelector('[data-act=check]').disabled=!canCheck(q); }));
}

function check(){
  const D=DOSSIERS[S.d], q=D.qs[S.q]; let ok=false, fb='';
  if(q.type==='mc'){ const oi=S.sel[0]; ok=!!q.opts[oi][1]; if(!ok){ fb=q.opts[oi][2]||'Dat klopt niet.'; (q._bad=q._bad||[]).push(oi); } }
  if(q.type==='multi'){ const good=S.sel.filter(i=>q.opts[i][1]).length; ok=good===q.need; if(!ok) fb=`${good} van je ${q.need} keuzes ${good===1?'is':'zijn'} goed. Kijk nog eens kritisch.`; }
  if(q.type==='assign'){ q._chk=q.rows.map((r,i)=>q._sel[i]===r[2]); const n=q._chk.filter(x=>!x).length; ok=n===0; if(!ok) fb=`${n} ${n===1?'antwoord klopt':'antwoorden kloppen'} nog niet (rood omrand).`; }
  if(q.type==='order'){ ok=S.sel.every((c,i)=>c===i); if(!ok){ const n=S.sel.filter((c,i)=>c===i).length; fb=`${n} van de ${q.cards.length} stappen staan op de goede plek. Wis en probeer opnieuw.`; } }
  if(q.type==='num'){ const v=parseFloat(String(S.sel).replace(',','.')); ok=v>=q.lo&&v<=q.hi; if(!ok) fb=isNaN(v)?'Vul een getal in.':(v>q.hi?'Te hoog. ':'Te laag. ')+'Let op de eenheden: reken km om naar cm.'; }
  if(q.type==='angle'){ const v=S.fig.angle; ok=v>=q.lo&&v<=q.hi; if(!ok) fb=v>q.hi?'Te steil: de lijn loopt onder de meeste bevingen door.':'Te vlak: de lijn loopt boven de diepe bevingen.'; }
  if(q.type==='pick'){ const v=S.fig.pick; ok=v>=q.lo&&v<=q.hi; if(!ok) fb=v<q.lo?'Te dicht bij de trog: daar ligt de plaat nog niet diep genoeg.':'Te ver landinwaarts: daar ligt de plaat al dieper dan 150 km.'; }
  if(ok){ S.scores[S.d][S.q]=[100,60,30][Math.min(S.tries,2)]; solve(q); }
  else { S.tries++; penalty(15); if(S.tries>=3){ q._fb='<b>Drie pogingen gebruikt.</b> Lees de uitleg goed: dit heb je nodig voor je rapport.'; S.scores[S.d][S.q]=0; solve(q,true); }
    else { q._fb=fb; if(q.type==='mc'||q.type==='multi'||q.type==='order') S.sel=[]; renderCase(); } }
}
function solve(q,revealed){ S.solved=true; if(!revealed) q._fb=null; if(revealed&&q.type==='angle') S.fig.angle=25; if(revealed&&q.type==='pick') S.fig.pick=330; if(q.type==='assign') q._chk=null; q.onSolve&&q.onSolve(S.fig); if(q.type==='mc'||q.type==='multi') S.sel=q.opts.map((o,i)=>o[1]?i:-1).filter(i=>i>=0); renderFig(); renderCase(); renderBar(); }
function nextQ(silent){ S.q++; S.tries=0; S.solved=false; S.sel=null; const q=DOSSIERS[S.d].qs[S.q]; if(q){ if(q.type==='mc'||q.type==='multi'||q.type==='order') S.sel=[]; q.pre&&q.pre(S.fig); } if(!silent){ renderFig(); renderCase(); } }
function nextD(){ if(S.d<DOSSIERS.length-1){ S.d++; S.q=-1; S.fig={anim:true, ghost: DOSSIERS[S.d].fig==='pB'?'A':null}; nextQ(true); render(); setTimeout(()=>{S.fig.anim=false;},1600); } else { S.running=false; S.finishedAt=new Date(); S.screen='report'; render(); } }

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-opt],[data-card],[data-act]'); if(!t) return;
  if(S.screen!=='play'){ if(t.dataset.act==='start'){ S.name=($('#naam')?.value||'').trim(); S.screen='play'; S.running=true; S.d=-1; startTimer(); nextD(); } if(t.dataset.act==='again'){ location.hash=''; restart(); } return; }
  const q=DOSSIERS[S.d].qs[S.q];
  if(t.dataset.opt!=null){ const oi=+t.dataset.opt; if(q.type==='mc') S.sel=[oi]; else { S.sel=S.sel||[]; S.sel=S.sel.includes(oi)?S.sel.filter(x=>x!==oi):(S.sel.length<q.need?[...S.sel,oi]:S.sel); } q._fb=null; renderCase(); }
  if(t.dataset.card!=null){ S.sel=[...(S.sel||[]),+t.dataset.card]; q._fb=null; renderCase(); }
  const a=t.dataset.act;
  if(a==='check') check();
  if(a==='hint'){ q._hint=true; penalty(30,t); renderCase(); }
  if(a==='clear'){ S.sel=[]; renderCase(); }
  if(a==='next') nextQ();
  if(a==='nextd') nextD();
});
function restart(){ DOSSIERS.forEach(d=>d.qs.forEach(q=>{delete q._o;delete q._sel;delete q._chk;delete q._fb;delete q._hint;delete q._bad;})); S={ screen:'intro', d:0, q:0, time:TOTAL, running:false, name:S.name, scores:DOSSIERS.map(d=>d.qs.map(()=>null)), tries:0, fig:{}, sel:null, solved:false }; render(); }

/* ---------- Intro ---------- */
function introHTML(){ return `<main class="full">
 <section class="panel hero"><div class="alert"><span class="dot" style="width:9px;height:9px;border-radius:50%;background:var(--magma);display:inline-block;animation:ping 1.6s infinite"></span>Alarm · seismisch netwerk Chili</div>
  <h1>Zware beving bij <span>Illapel</span></h1>
  <div class="readout"><div><small>datum</small><b>16-09-2015</b></div><div><small>tijd</small><b>19:54:32</b></div><div><small>magnitude</small><b>M 8,3</b></div><div><small>diepte</small><b>22 km</b></div><div><small>breedte</small><b>31,57° ZB</b></div><div><small>lengte</small><b>71,67° WL</b></div><div><small>plaats</small><b>46 km voor de kust</b></div><div><small>regio</small><b>Coquimbo, Chili</b></div></div>
  <canvas class="seis" id="seis" aria-label="Seismogram van de beving"></canvas>
  <p class="brief">Je bent analist bij het crisisteam aardwetenschappen. De minister wil <strong>over 15 minuten</strong> een rapport met antwoord op vier vragen. Je krijgt zes dossiers met echte meetgegevens. Je moet zelf de conclusies trekken.</p>
  <ul class="qlist"><li><span>01</span>Wat is er gebeurd?</li><li><span>02</span>Waarom staat hier geen enkele vulkaan, maar trilt de aarde wel zo hard?</li><li><span>03</span>Waarom juist hier?</li><li><span>04</span>Moet de kust ontruimd worden?</li></ul></section>
 <section class="panel side"><h3>Instructie</h3>
  <dl class="whk"><dt>WAT</dt><dd>Los zes dossiers op over de platentektoniek van Zuid-Amerika (§1.2).</dd><dt>HOE</dt><dd>Alleen, op je laptop. Kijk eerst goed naar het bewijsstuk links, beantwoord dan de vragen rechts.</dd><dt>HULP</dt><dd>Gebruik de tip van je collega (kost 30 seconden) of je boek §1.2. Kom je er niet uit: steek je hand op.</dd><dt>TIJD</dt><dd>15 minuten. Een fout antwoord kost 15 seconden.</dd><dt>KLAAR</dt><dd>Laat je rapport aan je docent zien. Maak daarna de schrijfopdracht in je schrift.</dd></dl>
  <div class="note">Punten per vraag: 100 bij de eerste poging, 60 bij de tweede, 30 bij de derde. Tijd over aan het einde levert bonuspunten op.</div>
  <label for="naam" class="note">Naam analist (komt op je rapport)</label><input type="text" id="naam" maxlength="40" value="${S.name.replace(/"/g,'&quot;')}" placeholder="Voornaam en achternaam" autocomplete="name">
  <div class="row"><button class="btn big" data-act="start">Start de missie</button></div>
  <div class="note">Alle data zijn echt: aardbevingen uit de USGS-catalogus, vulkanen uit het Smithsonian Global Volcanism Program, plaatgrenzen van Bird (2002).</div></section></main>`; }
function setupIntro(){ const cv=$('#seis'); if(!cv) return; const ctx=cv.getContext('2d'); const dpr=window.devicePixelRatio||1; const W=cv.clientWidth, H=cv.clientHeight; cv.width=W*dpr; cv.height=H*dpr; ctx.scale(dpr,dpr);
  let seed=3; const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647-.5;};
  const pts=[]; for(let i=0;i<W;i++){ const t=i/W; let a=0.04; if(t>.22) a=.25*Math.exp(-(t-.22)*9)+0.06; if(t>.38) a=Math.max(a,1*Math.exp(-(t-.38)*4.2)+0.05); pts.push(rnd()*a*2*(0.6+0.4*Math.sin(i*.9))); }
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches; let n=reduce?W:0;
  function frame(){ ctx.clearRect(0,0,W,H); ctx.strokeStyle='rgba(85,193,201,.12)'; ctx.lineWidth=1; for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    ctx.strokeStyle='#f3a83b'; ctx.lineWidth=1.3; ctx.beginPath(); for(let i=0;i<n;i++){ const y=H/2+pts[i]*H*.9; i?ctx.lineTo(i,y):ctx.moveTo(i,y);} ctx.stroke();
    ctx.fillStyle='#93aab6'; ctx.font='11px "IBM Plex Mono",monospace'; if(n>W*.22) ctx.fillText('P',W*.22+3,12); if(n>W*.38) ctx.fillText('S',W*.38+3,12); ctx.fillText('station LSC · component Z',W-180,H-6);
    if(n<W){ n+=Math.max(2,W/220); requestAnimationFrame(frame); } }
  frame(); }

/* ---------- Rapport ---------- */
function reportHTML(){
  const qp=scoreSum(), max=DOSSIERS.reduce((a,d)=>a+d.qs.length*100,0), bonus=Math.max(0,Math.round(S.time/2)), tot=qp+bonus, pct=qp/max;
  const rank=pct>=.85?'Hoofdseismoloog':pct>=.65?'Senior-analist':pct>=.45?'Analist':'Stagiair';
  const rows=DOSSIERS.map((d,i)=>`<tr><td>${d.code} ${d.title}</td><td class="r">${S.scores[i].reduce((a,b)=>a+(b||0),0)} / ${d.qs.length*100}</td></tr>`).join('');
  const memo=DOSSIERS.filter(d=>d.memo).map(d=>`<div><b>${d.memo[0]}</b>${d.memo[1]}</div>`).join('');
  const t=S.finishedAt||new Date();
  return `<main class="full"><section class="panel report"><div class="alert" style="color:var(--ok)">rapport verzonden · ${t.toLocaleDateString('nl-NL')} ${t.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})}</div>
   <h1 style="margin:0;font-family:var(--font-display);font-size:44px;line-height:1;text-transform:uppercase">Rapport aan de minister</h1>
   <div class="note">Analist: <b style="color:var(--fg)">${S.name?S.name.replace(/</g,'&lt;'):'(geen naam ingevuld)'}</b></div>
   <div class="memo">${memo}</div>
   <div class="task"><h3>Schrijfopdracht · 3 minuten · in je schrift</h3><p style="margin:.3em 0 0">Leg de minister in maximaal vier zinnen uit waarom er bij Illapel <b>wel</b> zware aardbevingen zijn maar <b>geen</b> vulkanen. Gebruik de begrippen <b>vlakke subductie</b>, <b>deelsmelt</b>, <b>koppeling</b> en <b>Juan Fernández-rug</b>.</p></div></section>
  <section class="panel side"><span class="rank">${rank}</span>
   <table class="rtab"><thead><tr><th>Dossier</th><th class="r">punten</th></tr></thead><tbody>${rows}
   <tr><td>Tijdbonus (${S.time>0?fmt(S.time)+' over':'deadline gemist'})</td><td class="r">+${bonus}</td></tr><tr class="tot"><td>Totaal</td><td class="r">${tot}</td></tr></tbody></table>
   <div class="note">Laat dit scherm aan je docent zien. Rangen: Hoofdseismoloog vanaf 85% van de vraagpunten, Senior-analist vanaf 65%, Analist vanaf 45%.</div>
   <div class="row"><button class="btn ghost" data-act="again">Nog een keer spelen</button></div></section></main>`;
}

/* ---------- Start ---------- */
function start(saved){ if(saved&&saved.S){ S=saved.S; } if(S.screen==='play'){ S.running=true; startTimer(); } render(); }
window.claude?.hot?.snapshot?.(()=>({S:{...S,fig:{...S.fig,anim:false}}}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
